<head>

  <title>Нет подключения — Военный Конспект</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#081327;color:#eef4ff;font:16px/1.6 system-ui,sans-serif}
    main{width:min(560px,100%);padding:32px;border:1px solid #263c65;border-radius:24px;background:#101d39;box-shadow:0 24px 70px #0006;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#65ddff,#9c8bff);color:#09162d;font-size:25px;font-weight:900}
    h1{margin:0 0 10px;font-size:25px}p{margin:0;color:#afbdd7}a{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:12px;background:#77dcff;color:#081327;text-decoration:none;font-weight:800}
  </style>
</head>
<body><main><div class="mark">ВК</div><h1>Нет подключения к интернету</h1><p>Когда сохранённая версия сайта доступна, браузер откроет локальный режим «Военного Конспекта». Попробуйте вернуться на главную страницу приложения.</p><a href="/">Открыть приложение</a></main></body>
